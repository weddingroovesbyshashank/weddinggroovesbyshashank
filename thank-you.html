<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | Wedding Grooves By Shashank</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      color: #ffffff;
      background:
        radial-gradient(circle at 12% 10%, rgba(18, 214, 208, 0.24), transparent 24rem),
        radial-gradient(circle at 90% 85%, rgba(255, 139, 0, 0.18), transparent 26rem),
        #041822;
      font-family: Poppins, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(680px, calc(100% - 32px));
      text-align: center;
    }

    img {
      width: min(210px, 60vw);
      margin: 0 auto 26px;
      filter:
        drop-shadow(0 0 2px rgba(255, 255, 255, 0.95))
        drop-shadow(0 0 18px rgba(255, 255, 255, 0.28));
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2.2rem, 8vw, 4.4rem);
      line-height: 1;
    }

    p {
      margin: 0 auto 30px;
      color: #d4e0e4;
      font-size: 1.1rem;
      line-height: 1.7;
    }

    a {
      display: inline-flex;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 0 24px;
      color: #ffffff;
      background: linear-gradient(90deg, #12d6d0, #ff8b00);
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <img src="assets/logo-site.png" alt="Wedding Grooves logo">
    <h1>Thank You</h1>
    <p>Your enquiry has been submitted. Wedding Grooves By Shashank will contact you soon.</p>
    <a href="/">Back to Website</a>
  </main>
</body>
</html>
